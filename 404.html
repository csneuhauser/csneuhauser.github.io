<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#243748">

<title>Page not found — C. Schuyler Neuhauser</title>
<meta name="description" content="This page could not be found.">

<!-- Error pages must never be indexed: they are not real content, and an
     indexed 404 is a wasted search result. -->
<meta name="robots" content="noindex, follow">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  /* Self-hosted webfonts — same two families and weights as the main page,
     so this file adds no new downloads for anyone who has already visited.
     Only the weights this page actually uses are declared. */
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/archivo-latin-600-normal.woff2') format('woff2');
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root {
    --font-display: 'Archivo', system-ui, sans-serif;
    --font-text: 'IBM Plex Sans', system-ui, sans-serif;
    --oak: #1b2733;
    --chestnut: #4a5a68;
    --oxblood: #9c4a32;
    --navy: #243748;
    --paper: #f4f5f6;
    --rule-strong: rgba(36,55,72,0.4);
    --underline: rgba(36,55,72,0.60);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--oak);
    font-family: var(--font-text);
    font-size: 1rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
  }

  .ribbon-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--navy);
  }

  .code {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--oxblood);
    margin: 0 0 1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.6rem, 5vw, 2.25rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 2px solid var(--rule-strong);
  }

  p {
    max-width: 34rem;
    margin: 0 auto 2rem;
    color: var(--chestnut);
  }

  a {
    color: var(--oak);
    text-decoration: underline;
    text-decoration-color: var(--underline);
    text-underline-offset: 3px;
  }
  a:hover { color: var(--oxblood); }

  .home {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--paper);
    background: var(--navy);
    padding: 0.7rem 1.4rem;
    display: inline-block;
  }
  .home:hover { background: var(--oxblood); color: var(--paper); }

  @media (prefers-reduced-motion: no-preference) {
    .home { transition: background 0.25s ease; }
  }
</style>
</head>
<body>
<div class="ribbon-top"></div>

<main>
  <p class="code">Error 404</p>
  <h1>This page could not be found</h1>
  <p>
    The address may have been mistyped, or the page may have moved. Everything
    on this site lives on a single page &mdash; so the link below will take you
    to all of it.
  </p>
  <a class="home" href="/">Return to the site</a>
</main>
</body>
</html>
